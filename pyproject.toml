[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optivedge-assessments"
version = "0.1.0"
description = "Assessment workflows for the OptivEdgeIntegrations Django framework."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "optivedge @ git+https://github.com/JasonBarrett77/OptivEdge.git@main",
    "optivedge-integrations @ git+https://github.com/JasonBarrett77/OptivEdgeIntegrations.git@main",
    # The engineer-detail workbook. Writes to a file-like object, so a build never needs a
    # path on disk - see assessments/artifacts/workbook.py.
    "XlsxWriter>=3.1",
]

[project.scripts]
optivedge-assessments = "assessments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["assessments*"]
exclude = ["assessments.tests*"]

[tool.setuptools.package-data]
assessments = [
    "controls_catalog/catalogs/*.json",
    "docs/*.md",
    "templates/**/*.html",
]

# Keep the wheel staging path short. Windows still caps a path at 260 characters
# unless long paths are enabled, and pip builds under
# %TEMP%\pip-install-xxxxxxxx\<project>_<32 hex>\ - a ~113 character root before
# this project contributes anything. The default staging leg,
# build\bdist.win-amd64\wheel\., spends 29 of the remainder for nothing; this
# spends 8. Measured 2026-09-23: it moved the worst path from 272 (which failed)
# to 235. See the migration renames in the same commit.
[tool.distutils.bdist_wheel]
bdist_dir = "build/w"
