{% load lucide %}
<div class="flex shrink-0 flex-col">
    <div class="flex shrink-0 items-center gap-1 px-1 pt-0.5 pb-1.5">
        {% for section in sections %}
        <a
            href="{% url section.url_name %}"
            class="inline-flex h-7 items-center gap-1.5 px-2.5 text-[12px] font-semibold whitespace-nowrap transition-colors {% if section.is_active %}bg-slate-800 text-white{% else %}text-slate-500 hover:bg-slate-100 hover:text-slate-700{% endif %}"
        >
            {{ section.name }}
            <span class="text-[10px] font-normal {% if section.is_active %}text-slate-300{% else %}text-slate-400{% endif %}">{{ section.count }}</span>
        </a>
        {% endfor %}
    </div>
    <div class="flex shrink-0 gap-2 border-b border-slate-200 px-1">
        {% for tab in tabs %}
        <a
            href="{% url tab.url_name %}"
            class="inline-flex h-9 items-center gap-1.5 border-b-2 px-3 text-sm font-medium transition-colors {% if tab.url_name == active_url_name %}border-blue-500 text-slate-900{% else %}border-transparent text-slate-500 hover:text-slate-700{% endif %}"
        >
            {% lucide tab.icon class="h-3.5 w-3.5 shrink-0" %}
            {{ tab.label }}
        </a>
        {% endfor %}
    </div>
</div>
