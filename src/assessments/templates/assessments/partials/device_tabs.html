{% load lucide %}
<div class="flex shrink-0 gap-2 border-b border-slate-200 px-1">
    <a
        href="{% url 'assessment_device_configuration_profile_list' %}"
        class="inline-flex h-9 items-center gap-1.5 border-b-2 px-3 text-sm font-medium transition-colors {% if active_tab == 'device_configuration' %}border-blue-500 text-slate-900{% else %}border-transparent text-slate-500 hover:text-slate-700{% endif %}"
    >
        {% lucide "monitor" class="h-3.5 w-3.5 shrink-0" %}
        Device Configuration
    </a>
    <a
        href="{% url 'assessment_management_interface_list' %}"
        class="inline-flex h-9 items-center gap-1.5 border-b-2 px-3 text-sm font-medium transition-colors {% if active_tab == 'management_interfaces' %}border-blue-500 text-slate-900{% else %}border-transparent text-slate-500 hover:text-slate-700{% endif %}"
    >
        {% lucide "shield" class="h-3.5 w-3.5 shrink-0" %}
        Management Interfaces
    </a>
    <a
        href="{% url 'assessment_interface_management_profile_list' %}"
        class="inline-flex h-9 items-center gap-1.5 border-b-2 px-3 text-sm font-medium transition-colors {% if active_tab == 'interface_management_profiles' %}border-blue-500 text-slate-900{% else %}border-transparent text-slate-500 hover:text-slate-700{% endif %}"
    >
        {% lucide "list-checks" class="h-3.5 w-3.5 shrink-0" %}
        Management Profiles
    </a>
</div>
