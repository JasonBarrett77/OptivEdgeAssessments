{% load lucide %}
<div class="flex shrink-0 gap-2 border-b border-slate-200 px-1">
    {% for tab in tabs %}
    <a
        href="{% url tab.url_name %}"
        class="inline-flex h-9 items-center gap-1.5 border-b-2 px-3 text-sm font-medium transition-colors {% if tab.url_name == active_url_name %}border-blue-500 text-slate-900{% else %}border-transparent text-slate-500 hover:text-slate-700{% endif %}"
    >
        {% lucide tab.icon class="h-3.5 w-3.5 shrink-0" %}
        {{ tab.label }}
    </a>
    {% endfor %}
</div>
