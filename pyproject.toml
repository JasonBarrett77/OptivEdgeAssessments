[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optivedge-assessments"
version = "0.1.0"
description = "Assessment workflows for the OptivEdgeIntegrations Django framework."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "optivedge @ git+https://github.com/JasonBarrett77/OptivEdge.git@main",
    "optivedge-integrations @ git+https://github.com/JasonBarrett77/OptivEdgeIntegrations.git@main",
    # The engineer-detail workbook. Writes to a file-like object, so a build never needs a
    # path on disk - see assessments/artifacts/workbook.py.
    "XlsxWriter>=3.1",
    # The health check document. Opens the committed scaffold read-only and saves to a
    # BytesIO, for the same reason - see assessments/artifacts/docx/scaffold.py.
    #
    # NOT docxtpl, which was the obvious alternative and is Jinja markers inside the Word file:
    # that is the modify-in-place approach Jason ruled out on 2026-11-05 ("modifying something
    # in place comes with its own challenges"), and it would put the report's structure in a
    # document nobody can diff.
    #
    # It was already in the venv at 1.2.0 and undeclared, which is how a build worked on this
    # machine and would have failed on a fresh install.
    "python-docx>=1.1",
]

[project.scripts]
optivedge-assessments = "assessments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["assessments*"]
exclude = ["assessments.tests*"]

[tool.setuptools.package-data]
assessments = [
    "controls_catalog/catalogs/*.json",
    # The health-check scaffold: Optiv's template with its body stripped to a marker, 1.49 MB
    # and 74 parts. Without this line the wheel ships the generator and not the file it needs,
    # and the first build on a deployed install is what finds out.
    "docx/*.docx",
    "docs/*.md",
    "templates/**/*.html",
]

# Keep the wheel staging path short. Windows still caps a path at 260 characters
# unless long paths are enabled, and pip builds under
# %TEMP%\pip-install-xxxxxxxx\<project>_<32 hex>\ - a ~113 character root before
# this project contributes anything. The default staging leg,
# build\bdist.win-amd64\wheel\., spends 29 of the remainder for nothing; this
# spends 8. Measured 2026-09-23: it moved the worst path from 272 (which failed)
# to 235. See the migration renames in the same commit.
[tool.distutils.bdist_wheel]
bdist_dir = "build/w"
